<!doctype html>
<html lang="en" data-theme="jarvis"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXIA // NEWS TRACKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.0/dist/umd/index.min.js"></script>
<style>
:root{--bg:#05080b;--panel:rgba(8,24,30,.72);--fg:#bdf6ff;--hi:#5ff3ff;--mut:#7fb3bd;--line:rgba(95,243,255,.28);--glow:0 0 6px rgba(95,243,255,.55);
--c-markets:#5fffb0;--c-business:#ffd166;--c-tech:#5ff3ff;--c-politics:#ff8fab;--c-world:#c79bff;--c-us:#8ab4ff;--c-science:#9effe0;--c-sports:#ffb86b;--c-filings:#ffe66d;
--font:"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
[data-theme=light]{--bg:#fbfaf7;--panel:#fff;--fg:#1d1d1f;--hi:#0b57d0;--mut:#5f6368;--line:#e2ded5;--glow:none;
--c-markets:#137333;--c-business:#9a6700;--c-tech:#0b57d0;--c-politics:#b3261e;--c-world:#6f3cc4;--c-us:#1a4fb5;--c-science:#00796b;--c-sports:#b45309;--c-filings:#7a5d00;--font:Georgia,"Iowan Old Style",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--font)}
[data-theme=jarvis] body{background:radial-gradient(ellipse at 50% -10%,#0b2a33 0%,#05080b 60%) fixed;
 background-image:linear-gradient(rgba(95,243,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(95,243,255,.045) 1px,transparent 1px),radial-gradient(ellipse at 50% -10%,#0b2a33 0%,#05080b 60%);background-size:40px 40px,40px 40px,100% 100%;background-attachment:fixed}
[data-theme=jarvis] body::after{content:"";pointer-events:none;position:fixed;inset:0;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
a{color:inherit}
/* HUD bar */
.hud{position:sticky;top:0;z-index:20;background:rgba(3,10,13,.92);border-bottom:1px solid var(--line);box-shadow:0 0 18px rgba(95,243,255,.12);backdrop-filter:blur(6px)}
[data-theme=light] .hud{background:var(--bg);box-shadow:none}
.hudrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;padding:10px 18px;font:600 13px/1.3 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
[data-theme=light] .hudrow{font-family:system-ui,sans-serif}
.brand{color:var(--hi);text-shadow:var(--glow);font-weight:800;font-size:15px;letter-spacing:.14em}
.hudrow b{color:var(--fg);font-weight:800}.sp{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;color:#ff5f6d;font-weight:800}
.live i{width:9px;height:9px;border-radius:50%;background:#ff3b4f;box-shadow:0 0 8px #ff3b4f;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.hudrow button{font:700 12px var(--font);letter-spacing:.08em;background:transparent;color:var(--hi);border:1px solid var(--line);padding:5px 10px;cursor:pointer;text-transform:uppercase}
/* ticker */
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);font-size:14px;padding:6px 0;color:var(--fg)}
.ticker .track{display:inline-block;padding-left:100%;animation:scroll 160s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker a{text-decoration:none;margin-right:42px}.ticker a:hover{color:var(--hi)}.ticker em{color:var(--hi);font-style:normal;margin-right:8px}
@keyframes scroll{to{transform:translateX(-100%)}}
/* layout */
.grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto;padding:18px}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);padding:14px 16px;box-shadow:inset 0 0 22px rgba(95,243,255,.05),0 0 10px rgba(95,243,255,.06)}
[data-theme=jarvis] .panel::before,[data-theme=jarvis] .panel::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--hi);filter:drop-shadow(0 0 4px var(--hi))}
[data-theme=jarvis] .panel::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
[data-theme=jarvis] .panel::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
[data-theme=light] .panel{border-radius:14px;box-shadow:none}
aside .panel{margin-bottom:16px}
h3{margin:0 0 10px;font:800 12px var(--font);letter-spacing:.18em;color:var(--hi);text-shadow:var(--glow);text-transform:uppercase}
[data-theme=light] h3{font-family:system-ui,sans-serif}
.tg{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font:14px var(--font);background:transparent;color:var(--fg);border:1px solid transparent;padding:5px 8px;margin:2px 0;cursor:pointer}
.tg:hover{border-color:var(--line)}
.tg .n{color:var(--mut);font-size:12px}
.tg.on{border-color:var(--hi);color:var(--hi);background:rgba(95,243,255,.08);box-shadow:var(--glow)}
.tg .dot{display:inline-block;width:8px;height:8px;margin-right:8px;background:var(--cc,var(--hi));box-shadow:0 0 6px var(--cc,var(--hi))}
select,input{font:15px var(--font);width:100%;background:rgba(0,0,0,.35);color:var(--fg);border:1px solid var(--line);padding:8px 10px;margin:4px 0}
[data-theme=light] select,[data-theme=light] input{background:#fff;border-radius:8px}
/* prompt */
.prompt{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:14px}
.prompt .ps{color:var(--hi);text-shadow:var(--glow);font-weight:800;white-space:nowrap}
.prompt input{flex:1;font-size:18px;border:0;border-bottom:1px solid var(--line);background:transparent;margin:0;padding:6px 2px;caret-color:var(--hi);outline:none}
.cur{display:inline-block;width:10px;height:20px;background:var(--hi);box-shadow:var(--glow);animation:blink 1s steps(1) infinite}
.prompt input:focus+.cur,.prompt input:not(:placeholder-shown)+.cur{display:none}
@keyframes blink{50%{opacity:0}}
.status{font-size:13px;color:var(--mut);margin:-4px 0 10px}
/* log rows */
.log{border-top:1px dashed var(--line);padding:11px 4px}
.log:first-child{border-top:0}
.tags{font-size:12.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 8px;margin-bottom:3px;letter-spacing:.02em}
.tags .tm{color:var(--hi)}
.chip{cursor:pointer;border:1px solid currentColor;padding:0 6px;font-weight:600;color:var(--cc,var(--mut))}
.chip.src{color:var(--fg);border-color:var(--line)}
.chip.pj{color:#e9c46a}[data-theme=light] .chip.pj{color:#7a5d00}
.chip.tk{color:#5fffb0;border-style:dashed}[data-theme=light] .chip.tk{color:#137333}
.log a.t{display:block;text-decoration:none;font-size:17px;font-weight:600;line-height:1.45;color:var(--fg)}
.log a.t:hover{color:var(--hi);text-shadow:var(--glow)}
.log p{margin:3px 0 0;color:var(--mut);font-size:14.5px}
[data-theme=light] .log a.t{font-size:20px;font-weight:700}[data-theme=light] .log p{font-size:16.5px}[data-theme=light] .tags{font-family:system-ui,sans-serif}
.log.fresh{border-left:3px solid var(--hi);padding-left:10px;animation:fadein 1.2s ease-out}
.log.type a.t{overflow:hidden;white-space:nowrap;animation:type 1.1s steps(40,end) both}
@keyframes fadein{from{opacity:0;transform:translateX(-8px);background:rgba(95,243,255,.12)}to{opacity:1}}
@keyframes type{from{max-width:0}to{max-width:100%}}
#more{display:block;margin:18px auto;font:700 13px var(--font);letter-spacing:.1em;background:transparent;color:var(--hi);border:1px solid var(--line);padding:10px 22px;cursor:pointer}
.filtbtn{display:none}
@media (max-width:860px){.grid{grid-template-columns:1fr;padding:10px}aside{display:none}aside.open{display:block}.filtbtn{display:inline-block}
 .hudrow{gap:4px 14px;font-size:11.5px;padding:8px 12px}.prompt,.prompt input{font-size:16px}.log a.t{font-size:16px}}
@media (prefers-reduced-motion:reduce){.ticker .track,.log.fresh,.log.type a.t,.cur,.live i{animation:none}}
</style></head><body>
<header class="hud">
 <div class="hudrow">
  <span class="brand">◢ AXIA://NEWS</span>
  <span class="live"><i></i>LIVE</span>
  <span>SYS <b id="clock">--:--:--</b> PT</span>
  <span>FEEDS <b id="hf">–/–</b></span>
  <span>ITEMS <b id="hi">–</b></span>
  <span>SYNC <b id="hs">–</b></span>
  <span class="sp"></span>
  <button class="filtbtn" id="fbtn">Filters</button>
  <button id="theme" title="Toggle theme">Light mode</button>
 </div>
 <div class="ticker"><div class="track" id="track">initializing feed uplink…</div></div>
</header>
<div class="grid">
 <aside id="side">
  <div class="panel"><h3>// Category</h3><div id="cats"></div></div>
  <div class="panel"><h3>// Project</h3><div id="projs"></div></div>
  <div class="panel"><h3>// Source &amp; Ticker</h3>
   <select id="src"><option value="">ALL SOURCES</option></select>
   <input id="tk" placeholder="TICKER e.g. AAPL" autocapitalize="characters">
  </div>
 </aside>
 <main class="panel">
  <label class="prompt"><span class="ps">&gt; query_</span><input type="search" id="q" placeholder=" " autocomplete="off"><span class="cur"></span></label>
  <div class="status" id="meta">Booting…</div>
  <div id="list"></div>
  <button id="more">LOAD MORE ▾</button>
 </main>
</div>
<script>
const CATS=["all","markets","business","tech","politics","world","us","science","sports","filings"];
const LBL={us:"U.S.",politics:"politics/policy",all:"all"};
let PL={},items=new Map(),ms=null,shown=60,cat="all",proj="",lastSeen=+localStorage.lastSeen||0,firstLoad=true,freshIds=new Set();
const $=id=>document.getElementById(id);
const TZ="America/Los_Angeles";
const fmt=new Intl.DateTimeFormat("en-US",{timeZone:TZ,month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
const clk=new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
const pt=ts=>fmt.format(new Date(ts*1000)).replace(",","");
const ago=ts=>{const s=Date.now()/1e3-ts;return s<3600?Math.max(1,Math.round(s/60))+"m":s<86400?Math.round(s/3600)+"h":Math.round(s/86400)+"d"};
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cc=c=>`style="--cc:var(--c-${c})"`;
setInterval(()=>$("clock").textContent=clk.format(new Date()),1000);
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.theme2=t;$("theme").textContent=t=="jarvis"?"Light mode":"Jarvis mode"}
setTheme(localStorage.theme2||"jarvis");
$("theme").onclick=()=>setTheme(document.documentElement.dataset.theme=="jarvis"?"light":"jarvis");
$("fbtn").onclick=()=>$("side").classList.toggle("open");
const params=new URLSearchParams(location.search);
if(params.get("q"))$("q").value=params.get("q");if(params.get("ticker"))$("tk").value=params.get("ticker");
if(params.get("project"))proj=params.get("project");if(params.get("category"))cat=params.get("category");
["q","src","tk"].forEach(id=>$(id).addEventListener("input",()=>{shown=60;render()}));
$("more").onclick=()=>{shown+=60;render()};
$("cats").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;cat=b.dataset.c;shown=60;render()};
$("projs").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;proj=proj==b.dataset.p?"":b.dataset.p;shown=60;render()};
$("list").onclick=e=>{const d=e.target.dataset;if(d.src!==undefined){$("src").value=d.src;render()}if(d.tk){$("tk").value=d.tk;render()}if(d.pj){proj=d.pj;render()}if(d.cat){cat=d.cat;render()}};
async function j(u){const r=await fetch(u+"?t="+Date.now());if(!r.ok)throw r.status;return r.json()}
function add(list,mark){let n=0;for(const it of list)if(!items.has(it.id)){items.set(it.id,it);n++;if(mark)freshIds.add(it.id)}return n}
function reindex(){ms=new MiniSearch({idField:"id",fields:["title","summary","source","tickers"],storeFields:[],extractField:(d,f)=>f=="tickers"?(d.tickers||[]).join(" "):d[f],searchOptions:{prefix:true,fuzzy:0.15,boost:{title:3}}});ms.addAll([...items.values()])}
function counts(){
  const all=[...items.values()],c={},p={};
  for(const i of all){c[i.category]=(c[i.category]||0)+1;for(const x of i.projects||[])p[x]=(p[x]||0)+1}
  $("cats").innerHTML=CATS.map(k=>`<button class="tg ${k==cat?"on":""}" data-c="${k}" ${cc(k)}><span><span class="dot"></span>${(LBL[k]||k).toUpperCase()}</span><span class="n">${k=="all"?all.length:(c[k]||0)}</span></button>`).join("");
  $("projs").innerHTML=Object.entries(PL).map(([k,v])=>`<button class="tg ${k==proj?"on":""}" data-p="${k}"><span>${esc(v)}</span><span class="n">${p[k]||0}</span></button>`).join("");
}
function render(){
  counts();
  const q=$("q").value.trim(),src=$("src").value,tk=$("tk").value.trim().toUpperCase().replace("$","");
  let arr=q&&ms?ms.search(q).map(r=>items.get(r.id)):[...items.values()].sort((a,b)=>b.ts-a.ts);
  arr=arr.filter(i=>(cat=="all"||i.category==cat)&&(!proj||(i.projects||[]).includes(proj))&&(!src||i.source==src)&&(!tk||(i.tickers||[]).includes(tk)));
  $("list").innerHTML=arr.slice(0,shown).map(i=>{const f=freshIds.has(i.id)||(lastSeen&&i.ts>lastSeen);return `<div class="log ${f?"fresh":""} ${freshIds.has(i.id)?"type":""}">
   <div class="tags"><span class="tm" title="${pt(i.ts)} PT">[${pt(i.ts)}]</span><span class="chip src" data-src="${esc(i.source)}">[${esc(i.source)}]</span><span class="chip" data-cat="${i.category}" ${cc(i.category)}>${(LBL[i.category]||i.category).toUpperCase()}</span>${(i.projects||[]).map(p=>`<span class="chip pj" data-pj="${p}">#${p}</span>`).join("")}${(i.tickers||[]).map(t=>`<span class="chip tk" data-tk="${t}">$${t}</span>`).join("")}<span>· ${ago(i.ts)} ago</span></div>
   <a class="t" href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>${i.summary?`<p>${esc(i.summary)}</p>`:""}</div>`}).join("")||"<p>&gt; no matching records_</p>";
  $("more").style.display=arr.length>shown?"block":"none";
  $("meta").textContent=`> ${arr.length.toLocaleString()} records match${q?` "${q}"`:""}${proj?` · project=${proj}`:""}${cat!="all"?` · category=${cat}`:""}`;
}
function ticker(){
  const top=[...items.values()].sort((a,b)=>b.ts-a.ts).slice(0,30);
  $("track").innerHTML=top.map(i=>`<a href="${esc(i.link)}" target="_blank" rel="noopener"><em>[${pt(i.ts).slice(-5)}]</em>${esc(i.title)}</a>`).join("");
}
async function refresh(){
  try{
    const st=await j("data/status.json");
    if(firstLoad){PL=st.projects||{};add(await j("data/latest.json"));reindex();render();ticker();
      for(const d of st.days){try{add(await j(`data/days/${d}.json`))}catch(e){}}
      const srcs=[...new Set([...items.values()].map(i=>i.source))].sort();
      $("src").innerHTML='<option value="">ALL SOURCES</option>'+srcs.map(s=>`<option>${esc(s)}</option>`).join("");
      if(params.get("source"))$("src").value=params.get("source");
      firstLoad=false;reindex();render();
    }else if(add(await j("data/latest.json"),true)){reindex();render();ticker();setTimeout(()=>freshIds.clear(),3000)}
    $("hf").textContent=`${st.feeds_ok}/${st.feeds_total}`;$("hi").textContent=items.size.toLocaleString();$("hs").textContent=clk.format(new Date(st.updated*1000)).slice(0,5)+" ("+ago(st.updated)+")";
  }catch(e){$("meta").textContent="> uplink error: "+e}
}
refresh();setInterval(refresh,120000);
addEventListener("beforeunload",()=>localStorage.lastSeen=Math.floor(Date.now()/1e3));
</script></body></html>
