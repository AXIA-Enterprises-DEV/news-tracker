<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>News Tracker</title>
<link rel="alternate" type="application/atom+xml" title="All news" href="feeds/all.xml">
<link rel="alternate" type="text/markdown" href="index.md">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.0/dist/umd/index.min.js"></script>
<style>
:root{--bg:#faf8f8;--fg:#2b2b2b;--mut:#6b6b6b;--line:#e5e5e5;--sec:#284b63;--ter:#84a59d;--hl:rgba(143,159,169,.15);--chip:#eef3f6;--side:#f4f2f2}
[data-theme=dark]{--bg:#161618;--fg:#ebebec;--mut:#a0a0a5;--line:#2e2e33;--sec:#7b97aa;--ter:#84a59d;--hl:rgba(143,159,169,.15);--chip:#23272c;--side:#1b1b1e}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 "Source Serif 4",Georgia,serif}
a{color:var(--sec);text-decoration:none}a:hover{text-decoration:underline}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 22px;font-family:Inter,system-ui,sans-serif}
.top .brand{font-weight:700;font-size:18px;color:var(--fg);white-space:nowrap}
.top input{flex:1;max-width:520px;font:15px Inter,sans-serif;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--side);color:var(--fg)}
.top button{font:14px Inter,sans-serif;background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--fg);cursor:pointer}
.live{font-size:13px;color:var(--mut);white-space:nowrap}.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2e9e5b;margin-right:6px;animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
.layout{display:grid;grid-template-columns:260px minmax(0,760px) 250px;gap:36px;justify-content:center;padding:24px 22px}
nav.left,aside.right{font:14px/1.55 Inter,system-ui,sans-serif;position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow:auto}
details{margin:2px 0 10px}summary{cursor:pointer;font-weight:700;color:var(--fg);padding:3px 0;list-style:none}summary::before{content:"▸ ";color:var(--mut)}details[open]>summary::before{content:"▾ "}
.tree a{display:flex;justify-content:space-between;gap:8px;padding:2px 0 2px 16px;color:var(--mut)}.tree a.cur,.tree a:hover{color:var(--sec);text-decoration:none}
.tree a .n{flex:none;font-size:12px;color:var(--mut)}
aside.right h4,nav.left h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
aside.right .toc a{display:block;color:var(--mut);padding:2px 0}aside.right .toc a.h3{padding-left:12px}
aside.right section{margin-bottom:26px}
.crumb{font:13px Inter,sans-serif;color:var(--mut);margin-bottom:6px}.crumb a{color:var(--mut)}
.meta{font:13px Inter,sans-serif;color:var(--mut);margin:-6px 0 18px;display:flex;flex-wrap:wrap;gap:6px 14px}
article h1{font:700 34px/1.2 Inter,system-ui,sans-serif;margin:0 0 14px}
article h2{font:700 23px/1.3 Inter,sans-serif;margin:34px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
article h3{font:600 17px Inter,sans-serif;margin:26px 0 6px;color:var(--mut)}
article ul{padding-left:20px}article li{margin:7px 0}article li::marker{color:var(--ter)}
article li .src{font:13.5px Inter,sans-serif;color:var(--mut)}
article table{border-collapse:collapse;width:100%;font:14px Inter,sans-serif}article td,article th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
code{font:14px "IBM Plex Mono",monospace;background:var(--chip);padding:1px 5px;border-radius:4px}
.tag{display:inline-block;font:12.5px/1.6 Inter,sans-serif;background:var(--hl);color:var(--sec);border-radius:6px;padding:0 7px;margin:0 3px 2px 0}
.tag.tk{color:#2e7d4f}[data-theme=dark] .tag.tk{color:#7fd1a0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;font:14px Inter,sans-serif}
.filters select{max-width:230px;font:14px Inter,sans-serif;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--side);color:var(--fg)}
.new{background:var(--hl);border-radius:4px;animation:fade 2s}@keyframes fade{from{background:rgba(132,165,157,.45)}}
#more{font:14px Inter,sans-serif;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 16px;color:var(--fg);cursor:pointer}
.menu{display:none}
@media (max-width:1180px){.layout{grid-template-columns:230px minmax(0,1fr)}aside.right{display:none}}
@media (max-width:760px){.layout{grid-template-columns:1fr;padding:14px}nav.left{display:none;position:static;max-height:none}nav.left.open{display:block}.menu{display:inline-block}.live{display:none}.top{padding:8px 12px;gap:8px}article h1{font-size:27px}}
</style></head><body>
<header class="top">
 <button class="menu" id="menu">☰</button>
 <a class="brand" href="#/">📰 News Tracker</a>
 <input id="q" type="search" placeholder="Search all items…  (/)" autocomplete="off">
 <span class="live" id="live"><i></i>…</span>
 <button id="theme" title="Toggle dark mode">🌙</button>
</header>
<div class="layout">
 <nav class="left" id="left"><h4>Explorer</h4><div class="tree" id="tree"></div></nav>
 <main><div class="crumb" id="crumb"></div><article id="page">Loading…</article></main>
 <aside class="right"><section><h4>On this page</h4><div class="toc" id="toc"></div></section><section><h4>Related tags</h4><div id="rel"></div></section></aside>
</div>
<script>
const $=id=>document.getElementById(id), TZ="America/Los_Angeles";
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fT=new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false});
const fD=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
const LBL={us:"U.S.",politics:"politics/policy"};
let M={projects:{},days:[],categories:[],tickers:[]},ST={},items=new Map(),ms=null,shown=80,fresh=new Set();
const params=new URLSearchParams(location.search);
// theme: light default, ?theme=dark|light; jarvis retired
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.qtheme=t;$("theme").textContent=t=="dark"?"☀️":"🌙"}
setTheme(params.get("theme")||localStorage.qtheme||"light");
$("theme").onclick=()=>setTheme(document.documentElement.dataset.theme=="dark"?"light":"dark");
$("menu").onclick=()=>$("left").classList.toggle("open");
addEventListener("keydown",e=>{if(e.key=="/"&&document.activeElement!=$("q")){e.preventDefault();$("q").focus()}});
async function j(u){const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now());if(!r.ok)throw r.status;return r}
function tagHref(t){if(t[0]=="$")return `#/tickers/${t.slice(1)}`;const k=t.slice(1);return M.projects[k]?`#/projects/${k}`:`#/categories/${k}`}
function chips(str){return str.replace(/(^|\s)([#$][A-Za-z][\w.\-]*)/g,(m,s,t)=>`${s}<a class="tag ${t[0]=="$"?"tk":""}" href="${tagHref(t)}">${esc(t)}</a>`)}
// ---- explorer tree
function tree(){
  const cur=location.hash||"#/";
  const sec=(name,arr,open)=>`<details ${open?"open":""}><summary>${name}</summary>${arr.map(([h,l,n])=>`<a href="${h}" class="${cur==h?"cur":""}">${esc(l)}${n!=null?`<span class="n">${n}</span>`:""}</a>`).join("")}</details>`;
  const cnt={};for(const i of items.values()){for(const p of i.projects||[])cnt["p"+p]=(cnt["p"+p]||0)+1;cnt["c"+i.category]=(cnt["c"+i.category]||0)+1}
  $("tree").innerHTML=`<a href="#/" class="${cur=="#/"?"cur":""}" style="padding-left:0;font-weight:700">⚡ Live feed</a><a href="#/index" style="padding-left:0">🏠 index.md</a>`+
   sec("Days",M.days.map(d=>[`#/news/${d}`,d]),cur.startsWith("#/news"))+
   sec("Projects",Object.entries(M.projects).map(([k,v])=>[`#/projects/${k}`,v,cnt["p"+k]||0]),true)+
   sec("Categories",M.categories.map(c=>[`#/categories/${c}`,LBL[c]||c,cnt["c"+c]||0]),true)+
   sec("Tickers",[["#/tickers/index","All active tickers"]].concat(M.tickers.slice(0,40).map(t=>[`#/tickers/${t}`,"$"+t])),cur.startsWith("#/tickers"))+
   sec("Machine-readable",[["#/sources/index","Sources"],["llms.txt","llms.txt"],["llms-full.txt","llms-full.txt"],["data/latest.json","latest.json"],["feeds/all.xml","Atom feed"]],false);
}
function sidebars(root){
  const hs=[...root.querySelectorAll("h2,h3")].slice(0,60);
  hs.forEach((h,n)=>h.id=h.id||"h"+n);
  $("toc").innerHTML=hs.map(h=>`<a class="${h.tagName.toLowerCase()}" href="javascript:document.getElementById('${h.id}').scrollIntoView()">${esc(h.textContent)}</a>`).join("")||"<span style='color:var(--mut)'>—</span>";
  const c={};root.querySelectorAll("a.tag").forEach(a=>c[a.textContent]=(c[a.textContent]||0)+1);
  $("rel").innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([t,n])=>`<a class="tag ${t[0]=="$"?"tk":""}" href="${tagHref(t)}">${esc(t)} ${n}</a>`).join("")||"—";
}
// ---- markdown pages
async function mdPage(path){
  const raw=await (await j(path+".md")).text();
  let fm={},body=raw;const m=raw.match(/^---\n([\s\S]*?)\n---\n/);
  if(m){body=raw.slice(m[0].length);m[1].split("\n").forEach(l=>{const k=l.indexOf(":");if(k>0)fm[l.slice(0,k).trim()]=l.slice(k+1).trim().replace(/^"|"$/g,"")})}
  const art=$("page");art.innerHTML=marked.parse(body);
  art.querySelectorAll("a[href]").forEach(a=>{const h=a.getAttribute("href");if(/^(\.\.\/|\.\/)?[\w\-\/.]+\.md$/.test(h)){const base=path.split("/").slice(0,-1);const parts=h.replace(/\.md$/,"").split("/");const out=[...base];for(const p of parts){if(p=="..")out.pop();else if(p!=".")out.push(p)}a.setAttribute("href","#/"+out.join("/"))}else if(/^https?:/.test(h)){a.target="_blank";a.rel="noopener"}});
  art.querySelectorAll("li").forEach(li=>{const a=li.querySelector("a");const rest=li.innerHTML.split("</a>");if(a&&rest.length>1){const tail=rest.slice(1).join("</a>");li.innerHTML=rest[0]+"</a>"+`<span class="src">${chips(tail)}</span>`}});
  const h1=art.querySelector("h1");const meta=`<div class="meta"><span>Updated ${esc((fm.updated||"").replace("T"," ").slice(0,16))} PT</span><span>${esc(fm.count||"")} items</span><a href="${path}.md" target="_blank">View raw .md</a>${path.startsWith("projects/")?`<a href="feeds/${path.split("/")[1]}.xml">Atom feed</a>`:""}</div>`;
  if(h1)h1.insertAdjacentHTML("afterend",meta);
  $("crumb").innerHTML=`<a href="#/">Home</a> › `+path.split("/").map(esc).join(" › ");
  sidebars(art);document.title=(fm.title||path)+" · News Tracker";
}
// ---- live feed (JSON) with filters + search
function liveLine(i){const t=[`#${i.category}`,...(i.projects||[]).filter(p=>p!=i.category).map(p=>"#"+p),...(i.tickers||[]).map(x=>"$"+x)].join(" ");
  return `<li class="${fresh.has(i.id)?"new":""}"><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a><span class="src"> — ${esc(i.source)} · ${fT.format(new Date(i.ts*1000))} PT · ${chips(t)}</span></li>`}
function livePage(){
  const q=$("q").value.trim(),f=window._f||{};
  let arr=q&&ms?ms.search(q).map(r=>items.get(r.id)):[...items.values()].sort((a,b)=>b.ts-a.ts);
  arr=arr.filter(i=>(!f.category||i.category==f.category)&&(!f.project||(i.projects||[]).includes(f.project))&&(!f.source||i.source==f.source)&&(!f.ticker||(i.tickers||[]).includes(f.ticker)));
  const opt=(k,vals)=>`<select data-k="${k}"><option value="">All ${k=="category"?"categories":k+"s"}</option>${vals.map(([v,l])=>`<option value="${esc(v)}" ${f[k]==v?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  const srcs=[...new Set([...items.values()].map(i=>i.source))].sort();
  let html=`<h1>${q?`Search: “${esc(q)}”`:"Live feed"}</h1><div class="meta"><span>${arr.length.toLocaleString()} items</span><span>Last sync ${ST.updated?fT.format(new Date(ST.updated*1000)):"–"} PT</span><a href="index.md" target="_blank">View raw .md</a><a href="llms.txt" target="_blank">llms.txt</a></div>
   <div class="filters">${opt("project",Object.entries(M.projects))}${opt("category",M.categories.map(c=>[c,LBL[c]||c]))}${opt("source",srcs.map(s=>[s,s]))}${opt("ticker",M.tickers.map(t=>[t,"$"+t]))}</div>`;
  let cur=null,ul=[];
  for(const i of arr.slice(0,shown)){const h=q?"Results":fD.format(new Date(i.ts*1000))+" "+fT.format(new Date(i.ts*1000)).slice(0,2)+":00 PT";if(h!=cur){if(ul.length)html+=`<ul>${ul.join("")}</ul>`;ul=[];html+=`<h3>${h}</h3>`;cur=h}ul.push(liveLine(i))}
  if(ul.length)html+=`<ul>${ul.join("")}</ul>`;if(!arr.length)html+="<p>No matching items.</p>";
  if(arr.length>shown)html+=`<button id="more">Show more</button>`;
  $("page").innerHTML=html;$("crumb").innerHTML="Home";
  $("page").querySelectorAll(".filters select").forEach(s=>s.onchange=()=>{window._f={...(window._f||{}),[s.dataset.k]:s.value};shown=80;syncURL();livePage()});
  if($("more"))$("more").onclick=()=>{shown+=80;livePage()};
  sidebars($("page"));document.title="News Tracker";
}
function syncURL(){const p=new URLSearchParams();const f=window._f||{};for(const k in f)if(f[k])p.set(k,f[k]);if($("q").value)p.set("q",$("q").value);if(params.get("theme"))p.set("theme",params.get("theme"));history.replaceState(null,"","?"+p.toString()+location.hash)}
async function route(){
  const h=(location.hash||"#/").slice(2);tree();window.scrollTo(0,0);
  if(!h){livePage();return}
  try{await mdPage(h=="index"?"index":h)}catch(e){$("page").innerHTML=`<h1>Not found</h1><p>${esc(h)}.md (${e})</p>`}
}
// legacy/URL params
window._f={project:params.get("project")||"",category:params.get("category")||"",source:params.get("source")||"",ticker:(params.get("ticker")||"").toUpperCase()};
if(params.get("q"))$("q").value=params.get("q");
$("q").addEventListener("input",()=>{shown=80;syncURL();if(location.hash&&location.hash!="#/")location.hash="#/";else livePage()});
addEventListener("hashchange",route);
function add(list,mark){let n=0;for(const i of list)if(!items.has(i.id)){items.set(i.id,i);n++;if(mark)fresh.add(i.id)}return n}
function reindex(){ms=new MiniSearch({idField:"id",fields:["title","summary","source","tickers","projects"],storeFields:[],extractField:(d,f)=>Array.isArray(d[f])?d[f].join(" "):d[f],searchOptions:{prefix:true,fuzzy:0.15,boost:{title:3}}});ms.addAll([...items.values()])}
async function refresh(first){
  try{
    ST=await (await j("data/status.json")).json();
    try{M=await (await j("data/manifest.json")).json()}catch(e){M={projects:ST.projects||{},days:ST.days||[],categories:[],tickers:[]}}
    const n=add(await (await j("data/latest.json")).json(),!first);
    if(first){reindex();await route();for(const d of ST.days){try{add(await (await j(`data/days/${d}.json`)).json())}catch(e){}}reindex();if(!location.hash||location.hash=="#/")livePage();tree()}
    else if(n){reindex();if(!location.hash||location.hash=="#/")livePage();setTimeout(()=>fresh.clear(),5000)}
    $("live").innerHTML=`<i></i>${ST.feeds_ok}/${ST.feeds_total} feeds · synced ${fT.format(new Date(ST.updated*1000))} PT`;
  }catch(e){$("live").textContent="offline: "+e}
}
refresh(true);setInterval(()=>refresh(false),120000);
</script></body></html>
