<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>News Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.0/dist/umd/index.min.js"></script>
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1f;--mut:#5f6368;--card:#fff;--line:#e6e3dc;--acc:#0b57d0;--chip:#eef2fb}
[data-theme=dark]{--bg:#121417;--fg:#e8e8e8;--mut:#a0a6ad;--card:#1b1e22;--line:#2b3036;--acc:#8ab4f8;--chip:#243042}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:19px/1.6 Georgia,"Iowan Old Style",serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.wrap{max-width:900px;margin:0 auto;padding:14px 20px}
h1{font:700 26px/1.2 system-ui,sans-serif;margin:0;display:flex;gap:12px;align-items:center;justify-content:space-between}
.meta{font:14px system-ui,sans-serif;color:var(--mut)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-family:system-ui,sans-serif}
input,select,button{font:16px system-ui,sans-serif;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
input[type=search]{flex:1 1 260px}button{cursor:pointer}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cats button{border-radius:999px;padding:6px 14px;font-size:15px}.cats button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:14px 0}
article a.t{color:var(--fg);text-decoration:none;font-weight:700;font-size:21px;line-height:1.35}article a.t:hover{color:var(--acc);text-decoration:underline}
article p{margin:8px 0 0;color:var(--mut);font-size:17px}
.row{font:14px system-ui,sans-serif;color:var(--mut);display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.chip{background:var(--chip);border-radius:6px;padding:1px 8px;cursor:pointer;color:var(--fg)}
.pj{background:transparent;border:1px solid var(--line)}.tk{font-weight:700;color:var(--acc)}.new{border-left:5px solid var(--acc)}
#more{display:block;margin:20px auto 40px}
</style></head><body>
<header><div class="wrap">
<h1>📰 News Tracker <button id="theme" title="Toggle dark mode">🌙</button></h1>
<div class="meta" id="meta">Loading…</div>
<div class="controls">
<input type="search" id="q" placeholder="Search headlines, companies, tickers…">
<select id="proj"><option value="">All projects</option></select>
<select id="src"><option value="">All sources</option></select>
<input id="tk" placeholder="Ticker e.g. AAPL" size="10">
</div>
<div class="cats" id="cats"></div>
</div></header>
<main class="wrap" id="list"></main>
<button id="more">Show more</button>
<script>
const CATS=["all","markets","business","tech","politics","world","us","science","sports","filings"];let PL={};
const LBL={us:"U.S.",politics:"politics/policy"};
let items=new Map(),ms=null,shown=60,cat="all",lastSeen=+localStorage.lastSeen||0,firstLoad=true;
const $=id=>document.getElementById(id);
const fmt=new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const pt=ts=>fmt.format(new Date(ts*1000))+" PT";
const ago=ts=>{const s=Date.now()/1e3-ts;return s<3600?Math.max(1,Math.round(s/60))+"m ago":s<86400?Math.round(s/3600)+"h ago":Math.round(s/86400)+"d ago"};
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.theme=t;$("theme").textContent=t=="dark"?"☀️":"🌙"}
setTheme(localStorage.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("theme").onclick=()=>setTheme(document.documentElement.dataset.theme=="dark"?"light":"dark");
$("cats").innerHTML=CATS.map(c=>`<button data-c="${c}" class="${c==cat?"on":""}">${LBL[c]||c}</button>`).join("");
$("cats").onclick=e=>{if(!e.target.dataset.c)return;cat=e.target.dataset.c;[...$("cats").children].forEach(b=>b.classList.toggle("on",b.dataset.c==cat));shown=60;render()};
["q","proj","src","tk"].forEach(id=>$(id).addEventListener("input",()=>{shown=60;render()}));
$("more").onclick=()=>{shown+=60;render()};
$("list").onclick=e=>{const d=e.target.dataset;if(d.src){$("src").value=d.src;render()}if(d.tk){$("tk").value=d.tk;render()}if(d.pj){$("proj").value=d.pj;render()}};
const params=new URLSearchParams(location.search);if(params.get("q"))$("q").value=params.get("q");if(params.get("project"))window._pj=params.get("project");if(params.get("ticker"))$("tk").value=params.get("ticker");
async function j(u){const r=await fetch(u+"?t="+Date.now());if(!r.ok)throw r.status;return r.json()}
function add(list){let n=0;for(const it of list)if(!items.has(it.id)){items.set(it.id,it);n++}return n}
function reindex(){ms=new MiniSearch({fields:["title","summary","source","tickers"],idField:"id",storeFields:[],extractField:(d,f)=>f=="tickers"?(d.tickers||[]).join(" "):d[f],searchOptions:{prefix:true,fuzzy:0.15,boost:{title:3}}});ms.addAll([...items.values()])}
function render(){
  const pj=$("proj").value,q=$("q").value.trim(),src=$("src").value,tk=$("tk").value.trim().toUpperCase().replace("$","");
  let arr=q&&ms?ms.search(q).map(r=>items.get(r.id)):[...items.values()].sort((a,b)=>b.ts-a.ts);
  arr=arr.filter(i=>(cat=="all"||i.category==cat)&&(!pj||(i.projects||[]).includes(pj))&&(!src||i.source==src)&&(!tk||(i.tickers||[]).includes(tk)));
  $("list").innerHTML=arr.slice(0,shown).map(i=>`<article class="${i.ts>lastSeen&&lastSeen?"new":""}">
   <div class="row"><span title="${pt(i.ts)}">${pt(i.ts)} · ${ago(i.ts)}</span><span class="chip" data-src="${esc(i.source)}">${esc(i.source)}</span><span class="chip">${LBL[i.category]||i.category}</span>${(i.projects||[]).map(p=>`<span class="chip pj" data-pj="${p}">${esc(PL[p]||p)}</span>`).join("")}${(i.tickers||[]).map(t=>`<span class="chip tk" data-tk="${t}">$${t}</span>`).join("")}</div>
   <a class="t" href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>${i.summary?`<p>${esc(i.summary)}</p>`:""}</article>`).join("")||"<p>No matching items.</p>";
  $("more").style.display=arr.length>shown?"block":"none";
}
async function refresh(){
  try{
    const st=await j("data/status.json");
    if(firstLoad){PL=st.projects||{};$("proj").innerHTML='<option value="">All projects</option>'+Object.entries(PL).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");if(window._pj)$("proj").value=window._pj;add(await j("data/latest.json"));reindex();render();
      for(const d of st.days){try{add(await j(`data/days/${d}.json`))}catch(e){}}
      const srcs=[...new Set([...items.values()].map(i=>i.source))].sort();
      $("src").innerHTML='<option value="">All sources</option>'+srcs.map(s=>`<option>${esc(s)}</option>`).join("");
      firstLoad=false;reindex();render();
    }else if(add(await j("data/latest.json"))){reindex();render()}
    $("meta").textContent=`Updated ${pt(st.updated)} · ${st.feeds_ok}/${st.feeds_total} feeds OK · ${items.size.toLocaleString()} items (last 14 days) · auto-refresh every 2 min`;
  }catch(e){$("meta").textContent="Could not load data ("+e+")"}
}
refresh();setInterval(refresh,120000);
addEventListener("beforeunload",()=>localStorage.lastSeen=Math.floor(Date.now()/1e3));
</script></body></html>
