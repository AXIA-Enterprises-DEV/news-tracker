name: update-news
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch:
  push: {branches: [main], paths: ["docs/index.html", "feeds.yml", "scripts/**", ".github/workflows/**"]}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: news-update, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/fetch.py
      - name: Commit data
        run: |
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add -A docs/data archive
          git diff --cached --quiet || (git commit -q -m "data: $(date -u +%FT%TZ)" && git pull -q --rebase -X theirs && git push -q)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deploy
        uses: actions/deploy-pages@v4
