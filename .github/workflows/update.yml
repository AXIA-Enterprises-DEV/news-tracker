name: update-news
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push: {branches: [main], paths: ["docs/index.html", "feeds.yml", "scripts/**", ".github/workflows/**"]}
permissions: {contents: write, pages: write, id-token: write, actions: write}
concurrency: {group: news-update, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/fetch.py && python scripts/render_md.py
      - name: Commit data
        run: |
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add -A docs archive
          git diff --cached --quiet || (git commit -q -m "data: $(date -u +%FT%TZ)" && git pull -q --rebase -X theirs && git push -q)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deploy
        uses: actions/deploy-pages@v4

  # Fallback heartbeat: GitHub cron on this repo has not fired reliably, so each non-scheduled run
  # waits ~10 min and re-dispatches the workflow. If a scheduled run happened in the last 20 min,
  # the chain stops (cron is working). To stop the chain: disable the workflow in the Actions tab.
  chain:
    needs: update
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait then re-dispatch
        env: {GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}"}
        run: |
          sleep 540
          last=$(gh run list -R "$REPO" -w update-news -e schedule -L 1 --json createdAt -q '.[0].createdAt' || true)
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 1200 ]; then echo "cron alive; stopping chain"; exit 0; fi
          pending=$(gh run list -R "$REPO" -w update-news -s queued -L 5 --json databaseId -q 'length')
          [ "$pending" -gt 0 ] && { echo "run already queued"; exit 0; }
          gh workflow run update-news -R "$REPO" --ref main
